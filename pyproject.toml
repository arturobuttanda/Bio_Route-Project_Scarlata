[project]
name = "benito-juarez-spatial-optimization"
version = "0.1.0"
description = "Simulación espacial, optimización bioinspirada de rutas e interoperabilidad GIS en Benito Juárez (CDMX)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "geopandas>=0.14.0",
    "osmnx>=1.9.0",
    "networkx>=3.2",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "pyarrow>=14.0.0,<18.0.0",
    "duckdb>=0.9.0",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.11.0",
    "deap>=1.4.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
]

[project.scripts]
bj-pipeline = "run_pipeline:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "config"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
